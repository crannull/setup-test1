name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Defines permissions required to write packages to GitHub Container Registry
permissions:
  packages: write
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into GHCR using automatically provided GitHub credentials
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dynamically extracts repository name to lowercase for Docker compliance
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true  # 👈 Changes from false to true to upload it
          tags: ghcr.io/${{ github.repository_owner }}/setup-test1:latest
